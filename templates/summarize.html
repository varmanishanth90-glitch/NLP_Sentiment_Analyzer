<!DOCTYPE html>
<html>
<head>
    <title>Text Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 500px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 14px;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #0056b3;
        }
        h3 {
            margin-top: 20px;
            color: #444;
        }
        .result {
            font-size: 16px;
            margin-top: 15px;
            text-align: left;
        }
        .back-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: background 0.3s ease;
        }
        .back-home:hover {
            background: #1e7e34;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📄 Text Summarizer</h2>
        <form method="POST" action="/summarize">
            <textarea name="text" rows="8" placeholder="Paste your text here..."></textarea><br>
            <button type="submit">Summarize</button>
        </form>
        {% if summary %}
            <h3>Summary:</h3>
            <div class="result">{{ summary }}</div>
        {% endif %}
        <a href="/" class="back-home">← Back to Home</a>
    </div>
</body>
</html>
