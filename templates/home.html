<!DOCTYPE html>
<html>
<head>
    <title>AI Tools Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 420px;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
        }
        a {
            display: block;
            margin: 15px 0;
            padding: 12px 20px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Welcome to AI Tools</h1>
        <p>Select an application:</p>
        <a href="/home">🧠 Sentiment Analyzer</a>
        <a href="/summarize">📄 Text Summarizer</a>
    </div>
</body>
</html>
